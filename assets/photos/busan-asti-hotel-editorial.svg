<svg width="1600" height="1200" viewBox="0 0 1600 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="800" y1="120" x2="800" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAF4"/>
      <stop offset="0.45" stop-color="#E9F4EF"/>
      <stop offset="1" stop-color="#F2EAF5"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="720" y1="280" x2="1110" y2="930">
      <stop stop-color="#DCE7E1"/>
      <stop offset="1" stop-color="#AFC4D4"/>
    </linearGradient>
    <linearGradient id="roof" x1="760" y1="280" x2="1030" y2="320">
      <stop stop-color="#5F8070"/>
      <stop offset="1" stop-color="#88A98F"/>
    </linearGradient>
    <linearGradient id="track" x1="170" y1="860" x2="1480" y2="860">
      <stop stop-color="#C7D9CC"/>
      <stop offset="1" stop-color="#A8B6BF"/>
    </linearGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#DCEBDF"/>
      <stop offset="1" stop-color="#90B29A"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#sky)"/>
